name: Feature request
description: Suggest a new capability or improvement
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea? For open-ended discussion, consider
        [GitHub Discussions](https://github.com/orgs/floci-io/discussions). Use this form when
        you have a concrete, actionable request.
  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Which Floci product would this affect?
      options:
        - floci (AWS)
        - floci-az (Azure)
        - floci-gcp (GCP)
        - floci-oci (OCI)
        - testcontainers-floci (Java)
        - testcontainers-floci-python
        - testcontainers-floci-node
        - testcontainers-floci-go
        - floci-cli
        - floci-ui
        - Org-wide / not sure
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem / motivation
      description: What are you trying to do, and what's getting in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the capability or change you'd like to see.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches or workarounds you've thought about.
    validations:
      required: false
