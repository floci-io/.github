name: PR Limit

# Reusable open-PR limits for every floci-io repository (floci-loft decisions 0020
# and 0021).
#
# Policy, per author and per repository, both hard limits:
#   - at most 2 pull requests ready for review (open, non-draft);
#   - at most 4 open pull requests in total, drafts included.
# A PR opened or reopened while the author already has 4 open is closed (the branch
# is never touched). A PR that would be the author's 3rd ready for review is turned
# back into a draft, so it keeps its place within the total of 4.
# Exempt: bot accounts, OWNER/MEMBER/COLLABORATOR, and anyone with write, maintain or
# admin permission on the repository (private org members show up as CONTRIBUTOR).
#
# Counting: on `opened` only the author's older PRs (lower number) count, so opening
# several at once keeps the oldest. On `reopened`, `ready_for_review` and manual runs
# every other open PR counts, so neither can get around a limit. `converted_to_draft`
# never acts: it only lowers the ready count.
# On `closed` and `converted_to_draft` the author's remaining PRs are reconciled: the
# legacy `over-pr-limit` label (no longer added) is removed once they are within the
# ready limit.
#
# The limits and the wording below say "2" and "4" literally: change them together.
# `enforce-caps` is the single switch; with it off the workflow only logs decisions.
# The per-repository callers never pass it.
#
# Callers run on `pull_request_target` and never check out PR code: this workflow only
# calls the GitHub API, so the elevated token is not exposed to the PR's contents.
# `contents: write` is needed only because the convertPullRequestToDraft mutation
# refuses the token without it (tested 2026-10-07). It makes the no-checkout rule
# load-bearing: never add a checkout of the PR head to this workflow or its callers.

on:
  workflow_call:
    inputs:
      pr-number:
        description: 'Pull request number to evaluate'
        required: true
        type: string
      dry-run:
        description: 'Log the decision without commenting, converting or closing'
        required: false
        type: boolean
        default: false
      enforce-caps:
        description: 'Act on the limits (floci-loft decision 0021); false only logs'
        required: false
        type: boolean
        default: true

env:
  READY_LIMIT: 2
  TOTAL_LIMIT: 4
  LABEL: over-pr-limit

jobs:
  evaluate:
    name: Check author open-PR count
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Evaluate and act
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ inputs.pr-number }}
          DRY_RUN: ${{ inputs.dry-run }}
          ENFORCE: ${{ inputs.enforce-caps }}
          EVENT_ACTION: ${{ github.event_name == 'pull_request_target' && github.event.action || 'manual' }}
        run: |
          set -euo pipefail

          run() {
            if [ "$DRY_RUN" = "true" ] || [ "$ENFORCE" != "true" ]; then
              echo "[log-only] $*"
            else
              "$@"
            fi
          }

          PR_JSON=$(gh api "repos/$REPO/pulls/$PR_NUMBER")
          AUTHOR=$(jq -r '.user.login' <<<"$PR_JSON")
          AUTHOR_TYPE=$(jq -r '.user.type' <<<"$PR_JSON")
          ASSOCIATION=$(jq -r '.author_association' <<<"$PR_JSON")
          IS_DRAFT=$(jq -r '.draft' <<<"$PR_JSON")
          STATE=$(jq -r '.state' <<<"$PR_JSON")
          echo "PR #$PR_NUMBER by $AUTHOR ($AUTHOR_TYPE, $ASSOCIATION), draft=$IS_DRAFT, state=$STATE, event=$EVENT_ACTION, enforce-caps=$ENFORCE, dry-run=$DRY_RUN"

          if [ "$AUTHOR_TYPE" = "Bot" ]; then
            echo "Bot author; exempt."
            exit 0
          fi
          case "$ASSOCIATION" in
            OWNER|MEMBER|COLLABORATOR)
              echo "Maintainer ($ASSOCIATION); exempt."
              exit 0
              ;;
          esac
          # A private org member is reported as CONTRIBUTOR, so also check the actual
          # repository permission. If the token cannot read it, fall back to the
          # association check above.
          PERMISSION=$(gh api "repos/$REPO/collaborators/$AUTHOR/permission" --jq '.permission' 2>/dev/null || echo unknown)
          case "$PERMISSION" in
            admin|maintain|write)
              echo "Author has $PERMISSION permission; exempt."
              exit 0
              ;;
          esac

          # Live list endpoint, not the search API: search indexing lags and can miss
          # the PR that was just opened.
          OPEN=$(gh pr list --repo "$REPO" --author "$AUTHOR" --state open --limit 200 \
                   --json number,isDraft,labels)

          # A PR closing or turning into a draft can bring the author back within the
          # ready limit. Reconcile only removes the legacy label: it never comments,
          # converts or closes.
          if [ "$EVENT_ACTION" = "closed" ] || [ "$EVENT_ACTION" = "converted_to_draft" ]; then
            READY=$(jq '[.[] | select(.isDraft | not)] | length' <<<"$OPEN")
            echo "Reconcile after $EVENT_ACTION: $AUTHOR has $READY open non-draft PR(s)."
            for number in $(jq -r --arg label "$LABEL" --argjson ready "$READY" --argjson limit "$READY_LIMIT" \
                              '.[] | select(any(.labels[]; .name == $label))
                                   | select(.isDraft or $ready <= $limit) | .number' <<<"$OPEN"); do
              run gh api -X DELETE "repos/$REPO/issues/$number/labels/$LABEL" > /dev/null 2>&1 || true
              echo "Removed the legacy $LABEL label from #$number."
            done
            exit 0
          fi

          if [ "$STATE" != "open" ]; then
            echo "PR is not open; nothing to do."
            exit 0
          fi

          OTHERS=$(jq --argjson pr "$PR_NUMBER" '[.[] | select(.number != $pr)]' <<<"$OPEN")
          if [ "$EVENT_ACTION" = "opened" ]; then
            COUNTED=$(jq --argjson pr "$PR_NUMBER" '[.[] | select(.number < $pr)]' <<<"$OTHERS")
          else
            COUNTED=$OTHERS
          fi

          COMMENTS=$(gh api "repos/$REPO/issues/$PR_NUMBER/comments" --paginate --jq '.[].body')
          has_marker() { grep -qF "$1" <<<"$COMMENTS"; }

          # GitHub renders a single newline in a comment as a hard line break, so
          # every paragraph is one line.
          total_closed_body() {
            cat <<'EOF'
          <!-- pr-limit-total-closed -->
          👋 Hi @{{author}}, thank you for your contribution to the project!

          To help our maintainers give thorough and timely reviews to everyone, our policy limits contributors to **4 open pull requests**, drafts included, and pull requests opened beyond that are closed automatically. You currently have **{{count}}** open pull requests in this repository, drafts included.

          We have temporarily closed this pull request to keep the review queue balanced. Don't worry, your branch and commits are completely safe!

          **Next steps:**
          1. Finish, merge or close one of your existing pull requests or drafts.
          2. Then simply reopen this one (or comment, and we will reopen it for you).

          Thank you for your understanding and for helping keep the review queue healthy! 🚀
          EOF
          }

          ready_draft_body() {
            cat <<'EOF'
          <!-- pr-limit-ready-draft -->
          👋 Hi @{{author}}, thank you for your contribution to the project!

          To help our maintainers give thorough and timely reviews to everyone, our policy limits contributors to **2 pull requests ready for review** at a time. You currently have **{{count}}** open, non-draft pull requests in this repository, counting this one.

          We have turned this pull request back into a draft. Nothing else changed: it stays open, and your branch and commits are untouched.

          **Next steps:**
          1. Focus with maintainers on your other ready pull requests to get them reviewed and merged.
          2. Once one of them is merged, closed or turned into a draft, mark this one as ready for review again.

          Thank you for your understanding and for helping keep the review queue healthy! 🚀
          EOF
          }

          render() {
            local text
            text=$("$1")
            text=${text//\{\{author\}\}/$AUTHOR}
            text=${text//\{\{count\}\}/$2}
            printf '%s\n' "$text"
          }

          # Total limit: only events that add an open PR change the total.
          if [ "$EVENT_ACTION" != "ready_for_review" ]; then
            TOTAL_POSITION=$(( $(jq 'length' <<<"$COUNTED") + 1 ))
            TOTAL=$(( $(jq 'length' <<<"$OTHERS") + 1 ))
            echo "Total position $TOTAL_POSITION (open PRs by $AUTHOR, drafts included: $TOTAL); limit $TOTAL_LIMIT."
            if [ "$TOTAL_POSITION" -gt "$TOTAL_LIMIT" ]; then
              if has_marker 'pr-limit-total-closed'; then
                echo "Closing notice already posted; closing without a new comment."
              else
                run gh pr comment "$PR_NUMBER" --repo "$REPO" --body "$(render total_closed_body "$TOTAL")"
              fi
              run gh pr close "$PR_NUMBER" --repo "$REPO"
              echo "Closed: total position $TOTAL_POSITION is above $TOTAL_LIMIT."
              exit 0
            fi
          fi

          if [ "$IS_DRAFT" = "true" ]; then
            echo "Draft within the total limit; nothing to do."
            exit 0
          fi

          # Ready limit.
          READY_POSITION=$(( $(jq '[.[] | select(.isDraft | not)] | length' <<<"$COUNTED") + 1 ))
          READY=$(( $(jq '[.[] | select(.isDraft | not)] | length' <<<"$OTHERS") + 1 ))
          echo "Ready position $READY_POSITION (open non-draft PRs by $AUTHOR: $READY); limit $READY_LIMIT."
          if [ "$READY_POSITION" -le "$READY_LIMIT" ]; then
            run gh api -X DELETE "repos/$REPO/issues/$PR_NUMBER/labels/$LABEL" > /dev/null 2>&1 || true
            echo "Within both limits."
            exit 0
          fi

          # `gh pr ready --undo` calls the convertPullRequestToDraft mutation. If the
          # token cannot convert, fail loudly instead of falling back to closing.
          if ! run gh pr ready "$PR_NUMBER" --repo "$REPO" --undo; then
            echo "::error::Could not convert #$PR_NUMBER back to a draft; no comment posted."
            exit 1
          fi
          run gh pr comment "$PR_NUMBER" --repo "$REPO" --body "$(render ready_draft_body "$READY")"
          echo "Converted to draft: ready position $READY_POSITION is above $READY_LIMIT."
